<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Seva & Exam Portal</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Font: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons via CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    /* Smooth custom scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">

  <!-- Toast Notification Banner -->
  <div id="toast-container" class="fixed top-4 right-4 z-50 hidden max-w-sm">
    <div id="toast-box" class="flex items-center gap-3 px-4 py-3 rounded-2xl shadow-xl border text-sm font-semibold bg-slate-900 text-white border-slate-700">
      <span id="toast-icon"></span>
      <span id="toast-text"></span>
    </div>
  </div>

  <!-- Main Root App Container -->
  <div id="app" class="flex-1 flex flex-col"></div>

  <!-- Subtle Footer with GitHub Pages Route Switcher -->
  <footer class="bg-white border-t border-slate-200 py-3.5 px-4 text-xs text-slate-500 mt-auto">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
      <p id="footer-copy">© 2026 Digital Seva & Exam Portal. All rights reserved.</p>
      <div class="flex items-center gap-3">
        <span>Active Route: <code id="route-indicator" class="bg-slate-100 px-2 py-0.5 rounded text-slate-700 font-mono">/</code></span>
        <button onclick="toggleAdminRoute()" id="route-switch-btn" class="text-slate-700 hover:text-slate-950 underline font-semibold cursor-pointer">
          Admin Panel (/admin) →
        </button>
      </div>
    </div>
  </footer>

  <!-- Modals Container -->
  <div id="modals-root"></div>

  <script>
    // =========================================================================
    // 1. THEME DEFINITIONS & DEFAULT QR SVG
    // =========================================================================
    const THEMES = {
      indigo: {
        name: 'Royal Indigo',
        btn: 'bg-indigo-600 hover:bg-indigo-700 text-white',
        text: 'text-indigo-600',
        light: 'bg-indigo-50 text-indigo-700 border-indigo-200',
        gradient: 'from-indigo-800 via-indigo-600 to-blue-700',
        ring: 'focus:ring-indigo-500',
        badge: 'bg-indigo-100 text-indigo-800',
      },
      emerald: {
        name: 'Emerald Green',
        btn: 'bg-emerald-600 hover:bg-emerald-700 text-white',
        text: 'text-emerald-600',
        light: 'bg-emerald-50 text-emerald-700 border-emerald-200',
        gradient: 'from-emerald-800 via-emerald-600 to-teal-700',
        ring: 'focus:ring-emerald-500',
        badge: 'bg-emerald-100 text-emerald-800',
      },
      rose: {
        name: 'Crimson Rose',
        btn: 'bg-rose-600 hover:bg-rose-700 text-white',
        text: 'text-rose-600',
        light: 'bg-rose-50 text-rose-700 border-rose-200',
        gradient: 'from-rose-800 via-rose-600 to-orange-600',
        ring: 'focus:ring-rose-500',
        badge: 'bg-rose-100 text-rose-800',
      },
      amber: {
        name: 'Royal Amber',
        btn: 'bg-amber-600 hover:bg-amber-700 text-white',
        text: 'text-amber-600',
        light: 'bg-amber-50 text-amber-800 border-amber-200',
        gradient: 'from-amber-700 via-amber-600 to-orange-600',
        ring: 'focus:ring-amber-500',
        badge: 'bg-amber-100 text-amber-800',
      },
      slate: {
        name: 'Executive Slate',
        btn: 'bg-slate-800 hover:bg-slate-900 text-white',
        text: 'text-slate-800',
        light: 'bg-slate-100 text-slate-800 border-slate-300',
        gradient: 'from-slate-900 via-slate-800 to-slate-700',
        ring: 'focus:ring-slate-600',
        badge: 'bg-slate-200 text-slate-800',
      },
    };

    const DEFAULT_QR_SVG = `data:image/svg+xml;utf8,${encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
        <rect width="220" height="220" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="4"/>
        <rect x="24" y="24" width="56" height="56" rx="8" fill="none" stroke="#0f172a" stroke-width="8"/>
        <rect x="40" y="40" width="24" height="24" rx="3" fill="#0f172a"/>
        <rect x="140" y="24" width="56" height="56" rx="8" fill="none" stroke="#0f172a" stroke-width="8"/>
        <rect x="156" y="40" width="24" height="24" rx="3" fill="#0f172a"/>
        <rect x="24" y="140" width="56" height="56" rx="8" fill="none" stroke="#0f172a" stroke-width="8"/>
        <rect x="40" y="156" width="24" height="24" rx="3" fill="#0f172a"/>
        <rect x="96" y="32" width="12" height="12" fill="#0f172a"/>
        <rect x="116" y="48" width="12" height="28" fill="#0f172a"/>
        <rect x="96" y="96" width="28" height="28" rx="6" fill="#4f46e5"/>
        <rect x="32" y="96" width="24" height="12" fill="#0f172a"/>
        <rect x="68" y="108" width="16" height="16" fill="#0f172a"/>
        <rect x="140" y="96" width="24" height="12" fill="#0f172a"/>
        <rect x="176" y="104" width="16" height="28" fill="#0f172a"/>
        <rect x="96" y="140" width="16" height="24" fill="#0f172a"/>
        <rect x="124" y="156" width="32" height="12" fill="#0f172a"/>
        <rect x="168" y="144" width="24" height="24" fill="#0f172a"/>
        <rect x="104" y="180" width="44" height="12" fill="#0f172a"/>
        <text x="110" y="212" font-family="sans-serif" font-size="10" font-weight="bold" fill="#475569" text-anchor="middle">UPLOAD YOUR QR IN ADMIN</text>
      </svg>
    `)}`;

    // =========================================================================
    // 2. APPLICATION STATE & LOCALSTORAGE PERSISTENCE
    // =========================================================================
    const STORAGE_KEYS = {
      SETTINGS: 'gh_portal_settings_v1',
      USERS: 'gh_portal_users_v1',
      SERVICES: 'gh_portal_services_v1',
      APPS: 'gh_portal_apps_v1',
      DEPOSITS: 'gh_portal_deposits_v1',
      NOTIFS: 'gh_portal_notifs_v1',
      CHATS: 'gh_portal_chats_v1',
      CURRENT_USER: 'gh_portal_curr_user_v1',
      ADMIN_AUTH: 'gh_portal_admin_auth_v1',
    };

    function loadData(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function saveData(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (e) {
        showToast('Storage full! Try uploading smaller images.', 'error');
      }
    }

    let state = {
      settings: loadData(STORAGE_KEYS.SETTINGS, {
        siteName: 'Digital Seva & Exam Portal',
        tagline: 'Fast & Secure Online Application & Wallet Service',
        theme: 'indigo',
        upiId: 'merchant@upi',
        qrImage: DEFAULT_QR_SVG,
        minDeposit: 200,
        adminPass: 'admin123',
      }),
      users: loadData(STORAGE_KEYS.USERS, []),
      services: loadData(STORAGE_KEYS.SERVICES, [
        {
          id: 'srv-1',
          name: 'Exam / Application Form',
          fee: 200,
          description: 'Application Number, DOB aur Exam Password / OTP daal kar submit karein.',
        },
      ]),
      applications: loadData(STORAGE_KEYS.APPS, []),
      deposits: loadData(STORAGE_KEYS.DEPOSITS, []),
      notifications: loadData(STORAGE_KEYS.NOTIFS, []),
      messages: loadData(STORAGE_KEYS.CHATS, []),
      currentUserId: loadData(STORAGE_KEYS.CURRENT_USER, null),
      isAdminLoggedIn: loadData(STORAGE_KEYS.ADMIN_AUTH, false),

      // UI Transient States
      authTab: 'login', // 'login' | 'register'
      userTab: 'apply', // 'apply' | 'history' | 'wallet'
      adminTab: 'users', // 'users' | 'apps' | 'deposits' | 'chat' | 'settings'
      selectedChatUserId: null,
      showAddMoneyModal: false,
      showUserChatDrawer: false,
      transferModalUserId: null,
      notifModalUserId: null,
      viewUserAppsId: null,
      tempNotifImageBase64: '',
    };

    function syncAllStorage() {
      saveData(STORAGE_KEYS.SETTINGS, state.settings);
      saveData(STORAGE_KEYS.USERS, state.users);
      saveData(STORAGE_KEYS.SERVICES, state.services);
      saveData(STORAGE_KEYS.APPS, state.applications);
      saveData(STORAGE_KEYS.DEPOSITS, state.deposits);
      saveData(STORAGE_KEYS.NOTIFS, state.notifications);
      saveData(STORAGE_KEYS.CHATS, state.messages);
      saveData(STORAGE_KEYS.CURRENT_USER, state.currentUserId);
      saveData(STORAGE_KEYS.ADMIN_AUTH, state.isAdminLoggedIn);
    }

    // Listen to changes across multiple tabs (e.g., User in Tab 1, Admin in Tab 2)
    window.addEventListener('storage', (e) => {
      if (Object.values(STORAGE_KEYS).includes(e.key)) {
        state.settings = loadData(STORAGE_KEYS.SETTINGS, state.settings);
        state.users = loadData(STORAGE_KEYS.USERS, state.users);
        state.services = loadData(STORAGE_KEYS.SERVICES, state.services);
        state.applications = loadData(STORAGE_KEYS.APPS, state.applications);
        state.deposits = loadData(STORAGE_KEYS.DEPOSITS, state.deposits);
        state.notifications = loadData(STORAGE_KEYS.NOTIFS, state.notifications);
        state.messages = loadData(STORAGE_KEYS.CHATS, state.messages);
        render();
      }
    });

    // =========================================================================
    // 3. ROUTING (SUPPORTS /admin OR #/admin FOR GITHUB PAGES)
    // =========================================================================
    function isAdminRoute() {
      const path = window.location.pathname.toLowerCase();
      const hash = window.location.hash.toLowerCase();
      return path.endsWith('/admin') || hash.includes('/admin');
    }

    function toggleAdminRoute() {
      if (isAdminRoute()) {
        window.location.hash = '/';
      } else {
        window.location.hash = '/admin';
      }
      render();
    }

    window.addEventListener('hashchange', render);
    window.addEventListener('popstate', render);

    // =========================================================================
    // 4. UTILITIES (TOAST, ESCAPE HTML, FILE TO BASE64)
    // =========================================================================
    let toastTimeout = null;
    function showToast(msg, type = 'success') {
      const container = document.getElementById('toast-container');
      const box = document.getElementById('toast-box');
      const text = document.getElementById('toast-text');
      const icon = document.getElementById('toast-icon');

      text.textContent = msg;
      if (type === 'error') {
        box.className = 'flex items-center gap-3 px-4 py-3 rounded-2xl shadow-xl border text-sm font-semibold bg-red-600 text-white border-red-700';
        icon.innerHTML = '<i data-lucide="alert-circle" class="w-5 h-5 text-red-200"></i>';
      } else {
        box.className = 'flex items-center gap-3 px-4 py-3 rounded-2xl shadow-xl border text-sm font-semibold bg-slate-900 text-white border-slate-700';
        icon.innerHTML = '<i data-lucide="check-circle-2" class="w-5 h-5 text-emerald-400"></i>';
      }

      container.classList.remove('hidden');
      lucide.createIcons();

      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        container.classList.add('hidden');
      }, 4000);
    }

    function esc(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function fileToBase64(file, callback) {
      if (!file) return;
      const reader = new FileReader();
      reader.onloadend = () => callback(reader.result);
      reader.readAsDataURL(file);
    }

    // =========================================================================
    // 5. USER PORTAL ACTIONS
    // =========================================================================
    function switchAuthTab(tab) {
      state.authTab = tab;
      render();
    }

    function handleUserRegister(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const mobile = document.getElementById('reg-mobile').value.trim();
      const password = document.getElementById('reg-pass').value.trim();

      if (!name || mobile.length < 10 || !password) {
        showToast('Kripya sahi Name, 10-digit Mobile Number aur Password daalein.', 'error');
        return;
      }
      if (state.users.some((u) => u.mobile === mobile)) {
        showToast('Ye Mobile Number pehle se registered hai! Login karein.', 'error');
        return;
      }

      const newUser = {
        id: 'usr_' + Date.now(),
        name,
        mobile,
        password,
        balance: 0,
        createdAt: new Date().toLocaleString(),
      };

      state.users.unshift(newUser);
      state.currentUserId = newUser.id;
      syncAllStorage();
      showToast(`Swagat hai ${newUser.name}! Account ban gaya hai.`);
      render();
    }

    function handleUserLogin(e) {
      e.preventDefault();
      const mobile = document.getElementById('login-mobile').value.trim();
      const password = document.getElementById('login-pass').value.trim();

      const found = state.users.find((u) => u.mobile === mobile && u.password === password);
      if (!found) {
        showToast('Galat Mobile Number ya Password!', 'error');
        return;
      }

      state.currentUserId = found.id;
      syncAllStorage();
      showToast(`Welcome back, ${found.name}!`);
      render();
    }

    function handleUserLogout() {
      state.currentUserId = null;
      syncAllStorage();
      render();
    }

    function setUserTab(tab) {
      state.userTab = tab;
      render();
    }

    function openAddMoneyModal() {
      state.showAddMoneyModal = true;
      render();
    }

    function closeAddMoneyModal() {
      state.showAddMoneyModal = false;
      render();
    }

    function submitAddBalance(e, instantApprove = false) {
      if (e) e.preventDefault();
      const user = state.users.find((u) => u.id === state.currentUserId);
      if (!user) return;

      const amtInput = document.getElementById('deposit-amount');
      const utrInput = document.getElementById('deposit-utr');
      const amt = Number(amtInput ? amtInput.value : 0);
      const utr = utrInput ? utrInput.value.trim() : '';
      const minAmt = Number(state.settings.minDeposit) || 200;

      if (isNaN(amt) || amt < minAmt) {
        showToast(`Minimum ₹${minAmt} add karna zaroori hai!`, 'error');
        return;
      }
      if (!instantApprove && !utr) {
        showToast('Payment karne ke baad UTR / Transaction ID daalein.', 'error');
        return;
      }

      const req = {
        id: 'dep_' + Date.now(),
        userId: user.id,
        userName: user.name,
        userMobile: user.mobile,
        amount: amt,
        utr: instantApprove ? 'TEST-INSTANT-' + Math.floor(100000 + Math.random() * 900000) : utr,
        status: instantApprove ? 'approved' : 'pending',
        createdAt: new Date().toLocaleString(),
      };

      state.deposits.unshift(req);

      if (instantApprove) {
        user.balance += amt;
        showToast(`₹${amt} aapke wallet me add ho gaya hai!`);
      } else {
        showToast(`₹${amt} ki request Admin ko bhej di gayi hai. Approval ke baad balance jud jayega.`);
      }

      state.showAddMoneyModal = false;
      syncAllStorage();
      render();
    }

    function handleServiceFormSubmit(e) {
      e.preventDefault();
      const user = state.users.find((u) => u.id === state.currentUserId);
      if (!user) return;

      const srvId = document.getElementById('srv-select').value;
      const appNumber = document.getElementById('srv-app-num').value.trim();
      const dob = document.getElementById('srv-dob').value.trim();
      const examPassOtp = document.getElementById('srv-pass-otp').value.trim();

      const service = state.services.find((s) => s.id === srvId) || state.services[0];
      if (!service) return;

      if (!appNumber || !dob || !examPassOtp) {
        showToast('Application Number, DOB aur Exam Password / OTP sabhi bharein.', 'error');
        return;
      }

      const fee = Number(service.fee) || 200;
      if (user.balance < fee) {
        showToast(`Insufficient Balance! Fees ₹${fee} hai. Pehle Add Balance se paise jodein.`, 'error');
        state.showAddMoneyModal = true;
        render();
        return;
      }

      // Deduct Fee
      user.balance -= fee;

      // Save Application
      state.applications.unshift({
        id: 'app_' + Date.now(),
        userId: user.id,
        userName: user.name,
        userMobile: user.mobile,
        serviceName: service.name,
        feePaid: fee,
        appNumber,
        dob,
        examPassOtp,
        status: 'Submitted',
        createdAt: new Date().toLocaleString(),
      });

      syncAllStorage();
      showToast(`Application Submit ho gayi! Wallet se ₹${fee} cut hue hain.`);
      state.userTab = 'history';
      render();
    }

    function updateSelectedServiceFeeBadge() {
      const sel = document.getElementById('srv-select');
      const badge = document.getElementById('srv-fee-badge');
      const summaryFee = document.getElementById('srv-summary-fee');
      const btnFee = document.getElementById('srv-btn-fee');
      const descEl = document.getElementById('srv-desc-text');
      if (!sel) return;
      const srv = state.services.find((s) => s.id === sel.value);
      if (srv) {
        if (badge) badge.textContent = `Fees: ₹${srv.fee}`;
        if (summaryFee) summaryFee.textContent = `₹${srv.fee}`;
        if (btnFee) btnFee.textContent = `₹${srv.fee}`;
        if (descEl) descEl.textContent = srv.description || '';
      }
    }

    function toggleUserChatDrawer(open) {
      state.showUserChatDrawer = open;
      render();
      if (open) {
        setTimeout(() => {
          const box = document.getElementById('user-chat-messages');
          if (box) box.scrollTop = box.scrollHeight;
        }, 50);
      }
    }

    function handleUserSendMessage(e) {
      e.preventDefault();
      const user = state.users.find((u) => u.id === state.currentUserId);
      const input = document.getElementById('user-chat-input');
      if (!user || !input || !input.value.trim()) return;

      state.messages.push({
        id: 'msg_' + Date.now(),
        userId: user.id,
        userName: user.name,
        userMobile: user.mobile,
        sender: 'user',
        text: input.value.trim(),
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        readByAdmin: false,
      });

      syncAllStorage();
      render();
      setTimeout(() => {
        const box = document.getElementById('user-chat-messages');
        if (box) box.scrollTop = box.scrollHeight;
      }, 50);
    }

    // =========================================================================
    // 6. ADMIN PANEL ACTIONS
    // =========================================================================
    function handleAdminLogin(e) {
      e.preventDefault();
      const pass = document.getElementById('admin-pass-input').value;
      if (pass === state.settings.adminPass) {
        state.isAdminLoggedIn = true;
        syncAllStorage();
        showToast('Admin Panel Login Successful!');
        render();
      } else {
        showToast('Galat Admin Password!', 'error');
      }
    }

    function handleAdminLogout() {
      state.isAdminLoggedIn = false;
      syncAllStorage();
      render();
    }

    function setAdminTab(tab) {
      state.adminTab = tab;
      render();
    }

    function openTransferModal(userId) {
      state.transferModalUserId = userId;
      render();
    }

    function closeTransferModal() {
      state.transferModalUserId = null;
      render();
    }

    function executeBalanceTransfer(e) {
      e.preventDefault();
      const user = state.users.find((u) => u.id === state.transferModalUserId);
      const type = document.getElementById('transfer-type').value;
      const amt = Number(document.getElementById('transfer-amt').value);

      if (!user || isNaN(amt) || amt <= 0) {
        showToast('Sahi amount daalein.', 'error');
        return;
      }

      if (type === 'add') {
        user.balance += amt;
        showToast(`${user.name} ke wallet me ₹${amt} add ho gaya!`);
      } else {
        user.balance = Math.max(0, user.balance - amt);
        showToast(`${user.name} ke wallet se ₹${amt} deduct ho gaya!`);
      }

      state.transferModalUserId = null;
      syncAllStorage();
      render();
    }

    function openNotifModal(userId) {
      state.notifModalUserId = userId;
      state.tempNotifImageBase64 = '';
      render();
    }

    function closeNotifModal() {
      state.notifModalUserId = null;
      state.tempNotifImageBase64 = '';
      render();
    }

    function handleNotifPhotoSelect(input) {
      if (input.files && input.files[0]) {
        fileToBase64(input.files[0], (b64) => {
          state.tempNotifImageBase64 = b64;
          const preview = document.getElementById('notif-img-preview');
          if (preview) {
            preview.src = b64;
            preview.classList.remove('hidden');
          }
        });
      }
    }

    function executeSendTargetedNotif(e) {
      e.preventDefault();
      const user = state.users.find((u) => u.id === state.notifModalUserId);
      const caption = document.getElementById('notif-caption-input').value.trim();
      const img = state.tempNotifImageBase64;

      if (!user || (!img && !caption)) {
        showToast('Photo upload karein ya Caption likhein.', 'error');
        return;
      }

      state.notifications.unshift({
        id: 'ntf_' + Date.now(),
        userId: user.id,
        userName: user.name,
        image: img,
        caption,
        createdAt: new Date().toLocaleString(),
      });

      state.notifModalUserId = null;
      state.tempNotifImageBase64 = '';
      syncAllStorage();
      showToast(`Notification sirf ${user.name} ko bhej diya gaya hai!`);
      render();
    }

    function openViewUserAppsModal(userId) {
      state.viewUserAppsId = userId;
      render();
    }

    function closeViewUserAppsModal() {
      state.viewUserAppsId = null;
      render();
    }

    function handleDepositApproval(depId, status) {
      const dep = state.deposits.find((d) => d.id === depId);
      if (!dep) return;
      dep.status = status;

      if (status === 'approved') {
        const user = state.users.find((u) => u.id === dep.userId);
        if (user) user.balance += dep.amount;
        showToast(`₹${dep.amount} approve karke ${dep.userName} ke wallet me add kar diya gaya.`);
      } else {
        showToast('Deposit request reject kar di gayi.', 'error');
      }

      syncAllStorage();
      render();
    }

    function selectAdminChatThread(userId) {
      state.selectedChatUserId = userId;
      state.messages.forEach((m) => {
        if (m.userId === userId && m.sender === 'user') m.readByAdmin = true;
      });
      syncAllStorage();
      render();
      setTimeout(() => {
        const box = document.getElementById('admin-chat-messages');
        if (box) box.scrollTop = box.scrollHeight;
      }, 50);
    }

    function handleAdminSendReply(e) {
      e.preventDefault();
      const input = document.getElementById('admin-reply-input');
      const uid = state.selectedChatUserId;
      if (!uid || !input || !input.value.trim()) return;

      const targetUser = state.users.find((u) => u.id === uid);
      state.messages.push({
        id: 'msg_' + Date.now(),
        userId: uid,
        userName: targetUser ? targetUser.name : 'User',
        userMobile: targetUser ? targetUser.mobile : '',
        sender: 'admin',
        text: input.value.trim(),
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        readByAdmin: true,
      });

      syncAllStorage();
      render();
      setTimeout(() => {
        const box = document.getElementById('admin-chat-messages');
        if (box) box.scrollTop = box.scrollHeight;
      }, 50);
    }

      if (input.files && input.files[0]) {

          showToast('Naya Payment QR Code update ho gaya!');
          render();

      state.settings.upiId = document.getElementById('set-upi').value.trim();

      syncAllStorage();
      showToast('Website Settings update ho gayi hain!');
      render();

      showToast(`Theme updated to ${THEMES[themeKey].name}`);

    function handleAddNewService(e) {
      e.preventDefault();

      const fee = Number(document.getElementById('new-srv-fee').value) || 200;

      state.services.push({

      showToast('Nayi service add ho gayi!');

              <div class="md:col-span-2 flex flex-col">
                ${!state.selectedChatUserId ? `
                  <div class="flex-1 flex items-center justify-center text-slate-400 text-sm p-6">
                    Left side se kisi user par click karke SMS dekhein aur reply karein.
                  </div>
                ` : (() => {
                  const chatUser = state.users.find((u) => u.id === state.selectedChatUserId);
                  const thread = state.messages.filter((m) => m.userId === state.selectedChatUserId);
                  return `
                    <div class="p-3.5 border-b border-slate-200 bg-slate-50 font-extrabold text-sm">
                      Chat with ${esc(chatUser ? chatUser.name : 'User')} (${esc(chatUser ? chatUser.mobile : '')})
                    </div>
                    <div id="admin-chat-messages" class="flex-1 p-4 space-y-3 overflow-y-auto max-h-[340px]">
                      ${thread.map((m) => `
                        <div class="flex flex-col max-w-[75%] ${m.sender === 'admin' ? 'ml-auto items-end' : 'mr-auto items-start'}">
                          <div class="px-3.5 py-2 rounded-2xl text-sm ${m.sender === 'admin' ? 'bg-slate-900 text-white rounded-br-none' : 'bg-slate-100 text-slate-800 rounded-bl-none'}">
                            ${esc(m.text)}
                          </div>
                          <span class="text-[10px] text-slate-400 mt-1">${esc(m.timestamp)}</span>
                        </div>
                      `).join('')}
                    </div>
                    <form onsubmit="handleAdminSendReply(event)" class="p-3 border-t border-slate-200 flex gap-2">
                      <input id="admin-reply-input" type="text" placeholder="User ko reply likhein..." required
                        class="flex-1 px-3.5 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none" />
                      <button type="submit" class="bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 rounded-xl text-xs font-extrabold flex items-center gap-1.5 cursor-pointer">
                        <i data-lucide="send" class="w-3.5 h-3.5"></i>
                        <span>Reply</span>
                      </button>
                    </form>
                  `;
                })()}
              </div>
            </div>
          ` : ''}

          <!-- ADMIN TAB 5: SITE SETTINGS, QR CODE & SERVICES -->
          ${state.adminTab === 'settings' ? `
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
              <!-- 1. QR Code Upload -->
              <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-4">
                <h3 class="font-extrabold text-slate-800 flex items-center gap-2 border-b pb-3">
                  <i data-lucide="qr-code" class="w-5 h-5 text-indigo-600"></i>
                  <span>Payment QR Code Lagayein</span>
                </h3>
                <div class="flex flex-col sm:flex-row items-center gap-4">
                  <img src="${state.settings.qrImage}" alt="Current QR" class="w-36 h-36 object-contain border border-slate-200 rounded-2xl p-2 bg-slate-50" />
                  <div class="flex-1 space-y-2.5 w-full">
                    <label class="block text-xs font-bold text-slate-700">Upload New QR Image (PhonePe / GPay / Paytm)</label>
                    <input type="file" accept="image/*" onchange="handleQrUpload(this)"
                      class="block w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer" />
                    <p class="text-[11px] text-slate-400">Image Base64 me save hoti hai taaki GitHub Pages par bina server ke kaam kare.</p>
                  </div>
                </div>
              </div>

              <!-- 2. Website Branding, Theme & Password -->
              <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-4">
                <h3 class="font-extrabold text-slate-800 flex items-center gap-2 border-b pb-3">
                  <i data-lucide="palette" class="w-5 h-5 text-purple-600"></i>
                  <span>Website Theme & Settings</span>
                </h3>
                <div class="space-y-3">
                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">Theme Color Chunein</label>
                    <div class="flex flex-wrap gap-2">
                      ${Object.entries(THEMES).map(([k, v]) => `
                        <button type="button" onclick="changeSiteTheme('${k}')" class="px-3 py-1.5 rounded-xl text-xs font-bold border transition cursor-pointer ${state.settings.theme === k ? 'bg-slate-900 text-white border-slate-900' : 'bg-slate-50 text-slate-700 border-slate-200'}">
                          ${v.name}
                        </button>
                      `).join('')}
                    </div>
                  </div>
                  <form onsubmit="handleSaveSiteSettings(event)" class="space-y-3 pt-1">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Website Name</label>
                        <input id="set-site-name" type="text" value="${esc(state.settings.siteName)}" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs font-bold" />
                      </div>
                      <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">UPI ID</label>
                        <input id="set-upi" type="text" value="${esc(state.settings.upiId)}" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs" />
                      </div>
                    </div>
                    <div>
                      <label class="block text-xs font-bold text-slate-700 mb-1">Tagline</label>
                      <input id="set-tagline" type="text" value="${esc(state.settings.tagline)}" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs" />
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                      <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Min Add Balance (₹)</label>
                        <input id="set-min-dep" type="number" value="${state.settings.minDeposit}" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs font-bold" />
                      </div>
                      <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Admin Password</label>
                        <input id="set-admin-pass" type="text" value="${esc(state.settings.adminPass)}" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs font-mono" />
                      </div>
                    </div>
                    <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-extrabold py-2.5 rounded-xl text-xs transition cursor-pointer">
                      Save Website Settings
                    </button>
                  </form>
                </div>
              </div>

              <!-- 3. Add / Manage Services -->
              <div class="lg:col-span-2 bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-4">
                <h3 class="font-extrabold text-slate-800 flex items-center gap-2 border-b pb-3">
                  <i data-lucide="plus-circle" class="w-5 h-5 text-emerald-600"></i>
                  <span>Add New Service (User Portal me dikhegi)</span>
                </h3>
                <form onsubmit="handleAddNewService(event)" class="grid grid-cols-1 md:grid-cols-4 gap-3">
                  <input id="new-srv-name" type="text" required placeholder="Service Name (e.g. Admit Card / Result)" class="md:col-span-2 px-3 py-2 border border-slate-300 rounded-xl text-sm" />
                  <input id="new-srv-fee" type="number" required value="200" placeholder="Fees (₹)" class="px-3 py-2 border border-slate-300 rounded-xl text-sm font-bold" />
                  <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold py-2 px-4 rounded-xl text-sm cursor-pointer">
                    + Add Service
                  </button>
                  <input id="new-srv-desc" type="text" placeholder="Short Instructions (Optional)" class="md:col-span-4 px-3 py-2 border border-slate-300 rounded-xl text-xs" />
                </form>

                <div class="divide-y divide-slate-100 border border-slate-200 rounded-2xl overflow-hidden">
                  ${state.services.map((s) => `
                    <div class="p-3.5 flex items-center justify-between bg-slate-50/60">
                      <div>
                        <div class="font-extrabold text-sm text-slate-800">${esc(s.name)} <span class="text-emerald-600 ml-2">(₹${s.fee})</span></div>
                        ${s.description ? `<div class="text-xs text-slate-500">${esc(s.description)}</div>` : ''}
                      </div>
                      ${state.services.length > 1 ? `
                        <button onclick="deleteService('${esc(s.id)}')" class="text-red-500 hover:bg-red-50 p-2 rounded-xl cursor-pointer" title="Delete Service">
                          <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                      ` : ''}
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>
          ` : ''}

        </main>
      `;
    }

    function renderAdminModals() {
      let html = '';

      // 1. TRANSFER BALANCE MODAL
      if (state.transferModalUserId) {
        const user = state.users.find((u) => u.id === state.transferModalUserId);
        if (user) {
          html += `
            <div class="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
              <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-2xl space-y-4">
                <div class="flex items-center justify-between border-b pb-3">
                  <h3 class="font-extrabold text-slate-900">Transfer Balance: ${esc(user.name)}</h3>
                  <button onclick="closeTransferModal()" class="cursor-pointer"><i data-lucide="x" class="w-5 h-5 text-slate-400"></i></button>
                </div>
                <p class="text-xs text-slate-500">Current Balance: <b class="text-emerald-600">₹${user.balance}</b></p>
                <form onsubmit="executeBalanceTransfer(event)" class="space-y-3">
                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Action Type</label>
                    <select id="transfer-type" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm font-bold">
                      <option value="add">+ Add Balance (Credit)</option>
                      <option value="deduct">- Deduct Balance (Debit)</option>
                    </select>
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Amount (₹)</label>
                    <input id="transfer-amt" type="number" required min="1" value="200" class="w-full px-3.5 py-2 border border-slate-300 rounded-xl text-sm font-extrabold" />
                  </div>
                  <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-extrabold py-2.5 rounded-xl text-sm cursor-pointer">
                    Confirm Balance Transfer
                  </button>
                </form>
              </div>
            </div>
          `;
        }
      }

      // 2. SEND PHOTO + CAPTION NOTIFICATION TO SPECIFIC USER MODAL
      if (state.notifModalUserId) {
        const user = state.users.find((u) => u.id === state.notifModalUserId);
        if (user) {
          html += `
            <div class="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
              <div class="bg-white rounded-2xl max-w-md w-full p-5 shadow-2xl space-y-4">
                <div class="flex items-center justify-between border-b pb-3">
                  <div>
                    <h3 class="font-extrabold text-slate-900">Send Photo Notice to ${esc(user.name)}</h3>
                    <p class="text-[11px] text-slate-500">Ye photo aur caption sirf ${esc(user.name)} (${esc(user.mobile)}) ke dashboard me dikhega.</p>
                  </div>
                  <button onclick="closeNotifModal()" class="cursor-pointer"><i data-lucide="x" class="w-5 h-5 text-slate-400"></i></button>
                </div>
                <form onsubmit="executeSendTargetedNotif(event)" class="space-y-3">
                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Upload Photo (Admit Card / Receipt / Notice)</label>
                    <input type="file" accept="image/*" onchange="handleNotifPhotoSelect(this)"
                      class="block w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-indigo-50 file:text-indigo-700 cursor-pointer" />
                    <img id="notif-img-preview" src="" alt="Preview" class="hidden mt-2 h-32 w-full object-contain rounded-xl border border-slate-200 bg-slate-50" />
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Caption / Message Likhein</label>
                    <textarea id="notif-caption-input" rows="3" placeholder="User ke liye message ya caption likhein..." class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm"></textarea>
                  </div>
                  <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold py-2.5 rounded-xl text-sm flex items-center justify-center gap-2 cursor-pointer">
                    <i data-lucide="send" class="w-4 h-4"></i>
                    <span>Send Notification to ${esc(user.name)}</span>
                  </button>
                </form>
              </div>
            </div>
          `;
        }
      }

      // 3. VIEW SPECIFIC USER APPLICATIONS MODAL
      if (state.viewUserAppsId) {
        const user = state.users.find((u) => u.id === state.viewUserAppsId);
        const uApps = state.applications.filter((a) => a.userId === state.viewUserAppsId);
        if (user) {
          html += `
            <div class="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
              <div class="bg-white rounded-2xl max-w-2xl w-full p-5 shadow-2xl space-y-4">
                <div class="flex items-center justify-between border-b pb-3">
                  <h3 class="font-extrabold text-slate-900">Applications by ${esc(user.name)} (${esc(user.mobile)})</h3>
                  <button onclick="closeViewUserAppsModal()" class="cursor-pointer"><i data-lucide="x" class="w-5 h-5 text-slate-400"></i></button>
                </div>
                ${uApps.length === 0 ? `
                  <p class="text-sm text-slate-400 py-6 text-center">Is user ne abhi tak koi form submit nahi kiya hai.</p>
                ` : `
                  <div class="overflow-x-auto max-h-80">
                    <table class="w-full text-left text-xs">
                      <thead class="bg-slate-50 text-slate-600 uppercase">
                        <tr>
                          <th class="px-3 py-2">Service</th>
                          <th class="px-3 py-2">App No.</th>
                          <th class="px-3 py-2">DOB</th>
                          <th class="px-3 py-2">Pass / OTP</th>
                          <th class="px-3 py-2">Fees</th>
                        </tr>
                      </thead>
                      <tbody class="divide-y divide-slate-100">
                        ${uApps.map((a) => `
                          <tr>
                            <td class="px-3 py-2 font-bold">${esc(a.serviceName)}</td>
                            <td class="px-3 py-2 font-mono font-bold">${esc(a.appNumber)}</td>
                            <td class="px-3 py-2">${esc(a.dob)}</td>
                            <td class="px-3 py-2 font-mono text-rose-600 font-bold">${esc(a.examPassOtp)}</td>
                            <td class="px-3 py-2 font-bold text-emerald-600">₹${a.feePaid}</td>
                          </tr>
                        `).join('')}
                      </tbody>
                    </table>
                  </div>
                `}
              </div>
            </div>
          `;
        }
      }

      return html;
    }

    // Initial Render on Page Load
    render();
  </script>
</body>
</html>
